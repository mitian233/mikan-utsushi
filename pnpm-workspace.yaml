packages:
  - apps/*
  - packages/*

# pnpm 12 blocks lifecycle scripts by default. These packages need theirs to
# place native binaries (workerd runtime, esbuild). Everything else is ignored.
allowBuilds:
  '@google/genai': false
  core-js-pure: false
  esbuild: true
  protobufjs: false
  workerd: true

# Explicit version requests must not silently bypass the release-age policy.
minimumReleaseAgeStrict: true
